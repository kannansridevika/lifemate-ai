<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeMate AI - Your Guide • Your Companion • Your Daily Support</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f4f6ff;color:#1e1b4b}
a{color:#4f46e5}.top{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;padding:14px 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:10}
.top b{font-size:20px;cursor:pointer}.top span{cursor:pointer;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.18)}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.08);margin-bottom:16px}
.btn{border:0;padding:13px 20px;border-radius:12px;cursor:pointer;font-weight:700;background:#4f46e5;color:#fff;font-size:16px}
.btn2{background:#eef2ff;color:#3730a3}.btn-green{background:#16a34a}.btn-red{background:#dc2626}.btn-pink{background:#db2777}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
.mic{width:120px;height:120px;border-radius:50%;font-size:40px;border:0;background:#dc2626;color:#fff;cursor:pointer;box-shadow:0 0 0 12px #fee2e2}
.pill{display:inline-block;background:#fef3c7;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700}
.demo{background:#fff7ed;border:1px dashed #f59e0b;padding:10px;border-radius:10px;font-size:14px;margin:10px 0}
.chatbox{border:1px solid #e5e7eb;height:280px;overflow:auto;padding:12px;border-radius:12px;background:#fbfbff}
.msg{padding:10px;border-radius:12px;margin:6px 0;max-width:85%}.me{background:#4f46e5;color:#fff;margin-left:auto}.ai{background:#eef2ff}
footer{text-align:center;padding:20px;color:#666}
</style></head>
<body><div id="root"></div>
<script src="components.js"></script>
<script src="app.js"></script>
</body></html>
